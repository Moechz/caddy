# ===========================================================================
# Caddy Web Server for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : caddy:2.11.4-alpine (Docker Hub, used unmodified)
#                  -> https://github.com/caddyserver/caddy
#
# Ports   : host 8002 -> container 8080. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/caddydocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the upstream image starts as root and keeps its configuration in root-owned
#           /etc/caddy. The entrypoint below keeps the user-editable Caddyfile in the
#           mounted application data directory, seeds a working default on the first start
#           and refuses to run an unusable Caddyfile (it falls back to a built-in default
#           instead of restarting in a loop).
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  caddydocker:
    image: caddy:2.11.4-alpine
    container_name: caddydocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    ports:
      - "8002:8080"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/caddydocker/config:/config
      - /Volume1/DockerAppData/caddydocker/data:/data
      - /Volume1/DockerAppData/caddydocker/www:/www
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8002
    protocol: http
